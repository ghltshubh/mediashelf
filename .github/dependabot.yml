# Weekly, grouped into one PR per ecosystem. A one-person project cannot absorb
# a PR per dependency, and a pile of them gets ignored, which is worse than not
# having Dependabot at all.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/app/web"
    schedule:
      interval: "weekly"
    groups:
      frontend:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
